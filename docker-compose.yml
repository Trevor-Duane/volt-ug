
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: volt
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: volt_dev_password
    ports:
      - "5432:5432"
    volumes:
      - volt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt -d volt"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://volt:volt_dev_password@db:5432/volt
    volumes:
      - ./backend:/app
      - volt_backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - volt_frontend_modules:/app/node_modules
    depends_on:
      - api

volumes:
  volt_postgres_data:
  volt_backend_venv:
  volt_frontend_modules:
